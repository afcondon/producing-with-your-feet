.controls-messages-header { font-size: 12px; font-weight: 600; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.03em; margin: 12px 0 6px; }

.controls-messages { display: flex; flex-direction: column; gap: 3px; }

.controls-message-row {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 3px 5px;
  background: var(--bg-section);
  border-radius: var(--radius);
  font-size: 11px;
  flex-wrap: wrap;
}

.controls-msg-num { font-size: 11px; color: var(--fg-light); min-width: 18px; }

.controls-msg-type-badge {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--active-bg);
  color: var(--active-fg);
  white-space: nowrap;
}

.controls-msg-fields { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }

.controls-msg-field {
  display: flex;
  align-items: center;
  gap: 2px;
}
.controls-msg-field-label { font-size: 10px; color: var(--fg-light); }
.controls-msg-field input {
  font-size: 12px;
  padding: 1px 3px;
  border: 1px solid var(--border-light);
  border-radius: 2px;
  text-align: right;
}

.controls-msg-select {
  font-size: 11px;
  padding: 1px 2px;
  border: 1px solid var(--border-light);
  border-radius: 2px;
}

.controls-msg-delete {
  font-size: 14px;
  line-height: 1;
  background: none;
  border: none;
  color: var(--fg-light);
  cursor: pointer;
  padding: 0 4px;
}
.controls-msg-delete:hover { color: #c00; }

.controls-add-message { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 3px; }
.controls-quick-add { display: flex; gap: 4px; margin-bottom: 6px; }
.controls-add-type { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; font-size: 12px; color: var(--fg-muted); }

.controls-empty { color: var(--fg-light); font-size: 13px; padding: 12px 0; }

/* Buttons */

.controls-btn {
  font-size: 12px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  cursor: pointer;
  transition: all 0.1s;
}
.controls-btn:hover { border-color: var(--fg-muted); }
.controls-btn.controls-btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.controls-btn.controls-btn-accent:hover { opacity: 0.9; }

.controls-btn-small {
  font-size: 11px;
  padding: 2px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  cursor: pointer;
}
.controls-btn-small:hover { border-color: var(--fg-muted); }
.controls-btn-danger { color: #c00; }
.controls-btn-danger:hover { border-color: #c00; }
/* A held session is a mode the instrument is in, not an action just taken, so
   it stays visibly lit for as long as it lasts. */
.controls-btn-held {
  background: #ecfdf5;
  border-color: #34d399;
  color: #065f46;
}
.controls-btn-held:hover { border-color: #059669; }

.controls-btn-tiny {
  font-size: 10px;
  padding: 1px 5px;
  border: 1px solid var(--border-light);
  border-radius: 2px;
  background: var(--bg);
  cursor: pointer;
}
.controls-btn-tiny:hover { border-color: var(--fg-muted); background: var(--bg-section); }

/* CC Search */

.controls-search-input-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.controls-search-icon { font-size: 14px; flex-shrink: 0; }

.controls-search-input {
  flex: 1;
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: var(--font);
}
.controls-search-input:focus { outline: none; border-color: var(--accent); }

.controls-search-target {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--fg-muted);
  flex-shrink: 0;
}
.controls-search-target select {
  font-size: 12px;
  padding: 3px 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.controls-search-results {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 6px;
  flex: 1;
  overflow-y: auto;
}

.controls-search-empty {
  font-size: 12px;
  color: var(--fg-light);
  padding: 4px 0;
  margin-top: 4px;
}

.controls-search-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 6px;
  font-size: 12px;
  background: var(--bg-section);
  border-radius: var(--radius);
}

.controls-search-pedal {
  font-weight: 600;
  font-size: 11px;
  min-width: 52px;
}

.controls-search-ch {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg-muted);
  min-width: 28px;
}

.controls-search-kind {
  font-size: 10px;
  color: var(--fg-light);
  min-width: 48px;
}

.controls-cc-num { font-family: var(--mono); font-size: 11px; color: var(--fg-muted); min-width: 40px; }
.controls-cc-label { flex: 1; }

/* CC Dictionary (modal overlay) */

.controls-dict-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
}

.controls-dict-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
}

.controls-dict-modal {
  position: relative;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
  max-width: 800px;
  width: 90%;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.controls-dict-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}

.controls-dict-close {
  font-size: 20px;
  line-height: 1;
  background: none;
  border: none;
  color: var(--fg-muted);
  cursor: pointer;
  padding: 0 4px;
}
.controls-dict-close:hover { color: var(--fg); }

.controls-dict-header {
  font-size: 12px;
  font-weight: 600;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.controls-dict-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 14px;
  overflow-y: auto;
  flex: 1;
}

.controls-dict-pedal {
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
}

.controls-dict-pedal-header {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 8px;
  cursor: pointer;
  font-size: 13px;
}
.controls-dict-pedal-header:hover { background: var(--bg-section); }

.controls-dict-arrow { font-size: 12px; min-width: 14px; color: var(--fg-muted); }
.controls-dict-pedal-name { font-weight: 600; }
.controls-dict-pedal-meta { font-size: 11px; color: var(--fg-muted); margin-left: 4px; }

.controls-dict-sections { padding: 4px 8px 8px 22px; display: flex; flex-direction: column; gap: 4px; }

.controls-dict-section {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  font-size: 12px;
}

.controls-dict-section-name {
  font-weight: 600;
  font-size: 11px;
  color: var(--fg-muted);
  margin-right: 2px;
}

.controls-dict-controls { display: flex; flex-wrap: wrap; gap: 3px; }

.controls-dict-control {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 1px 4px;
  background: var(--bg-section);
  border-radius: 3px;
  font-size: 11px;
}

.controls-dict-control-label { white-space: nowrap; }

/* Switch sections (all-switches panel) */

.controls-sw-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.controls-sw-section {
  padding: 6px 8px 6px 10px;
  border-radius: var(--radius);
  background: var(--bg);
}

.controls-sw-section-header {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}

.controls-sw-section-letter {
  font-size: 14px;
  font-weight: 700;
  min-width: 16px;
}

.controls-sw-label-input {
  font-size: 12px;
  padding: 2px 4px;
  border: 1px solid var(--border-light);
  border-radius: 2px;
  width: 64px;
  font-family: var(--mono);
}

.controls-sw-long-input {
  font-size: 12px;
  padding: 2px 4px;
  border: 1px solid var(--border-light);
  border-radius: 2px;
  flex: 1;
  min-width: 60px;
}

.controls-sw-toggle-label {
  font-size: 11px;
  color: var(--fg-muted);
  display: flex;
  align-items: center;
  gap: 2px;
  cursor: pointer;
}
.controls-sw-toggle-label input { margin: 0; }

.controls-sw-return-badge {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 1px 4px;
  border-radius: 2px;
  background: var(--fg-muted);
  color: #fff;
}

/* --- Pedal Donut View --- */

.pedal-view-container { display: flex; justify-content: center; padding: 16px; }
.pedal-view { max-width: 600px; width: 100%; }
.pedal-view-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
.pedal-view-header h2 { font-size: 18px; font-weight: 700; }
.pedal-view-header .brand { font-size: 13px; color: var(--fg-muted); }
.pedal-view-header .channel { font-size: 13px; color: var(--fg-light); font-family: var(--mono); }
.pedal-svg { width: 100%; display: block; }
.pedal-svg text { font-family: var(--font); }
.pedal-view-back {
  margin-top: 12px;
  padding: 4px 12px;
  font-size: 13px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--fg-muted);
  cursor: pointer;
}
.pedal-view-back:hover { color: var(--fg); border-color: var(--fg-muted); }

.card-donut-btn {
  margin-left: auto;
  padding: 0 4px;
  font-size: 14px;
  line-height: 1;
  border: none;
  background: none;
  color: var(--fg-light);
  cursor: pointer;
  opacity: 0.5;
}
.card-donut-btn:hover { opacity: 1; color: var(--pedal-color, var(--fg)); }

/* --- Overview View (treemap) --- */

.overview-container {
  display: flex;
  gap: 8px;
  padding: 16px;
  height: calc(100vh - 75px);
  box-sizing: border-box;
}
.overview-detail {
  flex-shrink: 0;
  height: 100%;
  border: 2px solid var(--border-light);
  border-radius: var(--radius);
  padding: 6px;
  box-sizing: border-box;
}
.overview-detail svg { width: 100%; height: 100%; }

/* Knob drags are pointer-driven, so the browser must not claim the gesture for
   scrolling or pinch-zoom. Without this, touch drags on iOS fire pointercancel
   the moment the finger moves and the knob stops tracking. Desktop is
   unaffected. Thumbnails are excluded — they are not draggable, so leaving them
   scrollable keeps the treemap usable on touch. */
#pedal-donut-hats,
#pedal-donut-hats svg,
.overview-detail,
.overview-detail svg {
  touch-action: none;
}

.overview-treemap {
  flex: 1;
  min-width: 0;
  /* grid-template set via inline style from PureScript */
}

.overview-cell {
  min-width: 0;
  min-height: 0;
  border: 2px solid var(--border-light);
  border-radius: var(--radius);
  padding: 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: border-color 0.2s ease;
}
.overview-cell:hover { border-color: var(--border); }
.overview-cell.active {
  border: 3px solid var(--fg);
  box-shadow: 0 0 0 2px var(--bg), 0 0 12px rgba(0,0,0,0.15);
  z-index: 1;
  transform: scale(1.02);
}

.overview-cell svg { width: 100%; height: 100%; }

.overview-cell-inner {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.overview-cell-inner > div:first-child { flex: 1; min-height: 0; }

.overview-cell-label {
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  text-align: center;
  margin-top: 2px;
  padding: 1px 5px;
  border-radius: 3px;
  flex-shrink: 0;
  line-height: 1;
}

.overview-cell-placeholder {
  text-align: center;
  color: var(--fg-light);
}
.overview-cell-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--fg-muted);
}
.overview-cell-brand {
  font-size: 10px;
}

/* Folder backup card (Chrome File System Access API → Infovore) */
.folder-backup {
  margin: 16px 0;
  padding: 12px 16px;
  background: var(--bg-section);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.folder-backup h3 {
  margin: 0 0 8px 0;
  font-size: 14px;
  font-weight: 600;
}
.folder-backup-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.folder-backup-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 12px;
  font-family: var(--mono);
}
.folder-backup-chip.connected {
  background: var(--active-bg);
  color: var(--active-fg);
}
.folder-backup-chip.disconnected {
  background: var(--border);
  color: var(--fg-muted);
}
.folder-backup-muted {
  font-size: 12px;
  color: var(--fg-muted);
}
.folder-backup-error {
  margin-top: 8px;
  padding: 6px 10px;
  background: #fee;
  color: #b00;
  font-size: 12px;
  border-radius: 3px;
}
.files-btn-muted {
  background: #fff !important;
  color: var(--fg) !important;
}
</style>
