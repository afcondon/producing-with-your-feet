.card-presets-section .slot-grid { grid-template-columns: repeat(8, 1fr); }
.card-presets-section .slot-grid-heading { font-size: 10px; }
.card-presets-section .slot-btn { font-size: 10px; padding: 4px 1px; }

/* --- Controls View --- */

.controls-view {
  display: flex;
  flex-direction: column;
  gap: 0;
  min-height: calc(100vh - 80px);
}

/* ──── Controls: instrument → bank → switch ──── */

.controls-zone {
  border-top: 1px solid var(--border);
  padding: 12px;
}

.controls-zone-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.controls-zone-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
.controls-zone-sub { font-size: 11px; color: var(--fg-muted); }
.controls-zone-back {
  background: none; border: none; cursor: pointer;
  font-size: 11px; color: var(--fg-muted); padding: 0;
  text-transform: uppercase; letter-spacing: .04em;
}
.controls-zone-back:hover { color: var(--accent); }

/* The bank's own facts, as a header strip rather than a side panel: the name
   is the heading, the number is identification beside it, and the grid gets
   the full width underneath. */
.controls-bank-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.controls-bank-name-input {
  font-size: 16px; font-weight: 600; padding: 3px 6px;
  border: 1px solid transparent; border-radius: var(--radius);
  background: transparent; min-width: 220px; flex: 0 1 320px;
}
.controls-bank-name-input:hover { border-color: var(--border); }
.controls-bank-name-input:focus { border-color: var(--accent); background: #fff; outline: none; }

.controls-bank-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 6px 8px; margin-bottom: 12px;
  background: var(--bg-section); border-radius: var(--radius);
}
.controls-bank-bar label {
  font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--fg-muted); font-weight: 600;
}
.controls-bank-notes-input {
  flex: 1 1 240px; min-width: 0; font-size: 12px; padding: 3px 6px;
}
.controls-bank-bar .controls-btn-danger { margin-left: 0; }

.controls-bank-body { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }

/* Four rows of three, matching the survey card and the pedal underfoot. */
.controls-bank-switches {
  display: grid;
  grid-template-columns: repeat(3, minmax(120px, 200px));
  gap: 6px;
  max-width: 640px;
}
.controls-bank-side { flex: 1; min-width: 220px; max-width: 380px; }

.controls-bank-switch {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 8px;
  cursor: pointer;
  background: #fff;
  min-height: 58px;
}
.controls-bank-switch:hover { border-color: var(--fg-light); }
.controls-bank-switch.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.controls-bank-switch.return { background: var(--bg-section); }
.controls-bank-switch-head { display: flex; align-items: center; gap: 6px; }
.controls-bank-switch-letter { font-size: 13px; font-weight: 700; }
.controls-bank-switch-label { font-size: 12px; font-weight: 600; margin-top: 2px; }
.controls-bank-switch-verb { font-size: 10px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .04em; }
.controls-bank-switch-observed { font-size: 10px; color: #be123c; margin-top: 2px; }

/* Globals: instrument furniture. One mark, one tint, no third state — a slot
   is global or it is local, and the whole point of the rewrite is that you can
   tell which by looking. Purple throughout, kept away from the accent so the
   scope of a switch never reads as its selection. */
.controls-global-mark { font-size: 11px; color: #7e22ce; }
.controls-bank-switch.global { background: #faf5ff; }
.controls-bank-switch.global .controls-bank-switch-label { color: #6b21a8; }
.controls-bank-switch.vacant { opacity: .55; }

/* The device's own switches, shown before we take a bank over. Flat and
   uninviting on purpose: it is evidence, not a surface. The one loud thing is
   the switch a global is about to overwrite, because that cell is the only
   place its contents are ever visible. */
.controls-device-preview { margin: 4px 0 12px; }
.controls-device-preview-head {
  font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--fg-muted); margin-bottom: 6px;
}
.controls-bank-switch.readonly { cursor: default; background: var(--bg-section); }
.controls-bank-switch.readonly:hover { border-color: var(--border); }
.controls-bank-switch.readonly.displaced {
  background: #fff1f2; border-color: #fda4af;
}
.controls-bank-switch.readonly.displaced .controls-bank-switch-label { color: #9f1239; }

.controls-scope-banner {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 6px 10px; margin-bottom: 10px; border-radius: var(--radius);
  font-size: 12px;
}
.controls-scope-banner.global { background: #faf5ff; border-left: 3px solid #7e22ce; }
.controls-scope-banner.local { background: var(--bg-section); border-left: 3px solid var(--border); }
.controls-scope-text { flex: 1 1 320px; }

.controls-global-preview {
  border: 1px solid var(--border-light); border-radius: var(--radius);
  padding: 8px 10px; font-size: 12px; max-width: 46ch;
}
.controls-global-preview-name { font-weight: 600; margin-bottom: 4px; }
.controls-global-preview-msg {
  color: var(--fg-muted); font-variant-numeric: tabular-nums; padding: 1px 0;
}
.controls-global-preview-type {
  display: inline-block; min-width: 8ch; font-weight: 600; color: #6b21a8;
}

.controls-globals-card {
  margin: 0 12px 12px; padding: 8px 10px; cursor: pointer;
  border: 1px solid var(--border-light); border-radius: var(--radius);
  background: #faf5ff;
}
.controls-globals-card.selected { border-color: #7e22ce; box-shadow: inset 0 0 0 1px #7e22ce; }
.controls-globals-card-head { display: flex; align-items: baseline; gap: 8px; }
.controls-globals-card-head h4 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
  color: #6b21a8; margin: 0;
}
.controls-globals-card-sub { font-size: 11px; color: var(--fg-light); margin-left: auto; }
.controls-globals-card-empty { font-size: 11px; color: var(--fg-muted); margin: 6px 0 0; }
.controls-globals-row {
  display: flex; align-items: baseline; gap: 8px;
  font-size: 12px; padding: 2px 0;
}
.controls-globals-slot { font-weight: 700; width: 1.4em; color: #6b21a8; }
.controls-globals-label { flex: 1; }
.controls-globals-note {
  font-size: 12px; color: var(--fg-muted); max-width: 68ch; margin: 0 0 12px;
}

/* The stamp picker: the flexible half, kept visibly separate from globals. */
.controls-stamp {
  background: var(--bg); border-radius: var(--radius);
  padding: 16px; width: min(760px, 92vw); max-height: 82vh; overflow-y: auto;
}
.controls-stamp-head { display: flex; align-items: center; gap: 12px; }
.controls-stamp-head h3 { margin: 0; font-size: 15px; flex: 1; }
.controls-stamp-note { font-size: 12px; color: var(--fg-muted); max-width: 64ch; }
.controls-stamp-bar { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.controls-stamp-count { font-size: 11px; color: var(--fg-light); font-variant-numeric: tabular-nums; }
.controls-stamp-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px;
}
.controls-stamp-cell {
  display: flex; flex-direction: column; gap: 1px; cursor: pointer;
  border: 1px solid var(--border-light); border-radius: var(--radius); padding: 5px 7px;
}
.controls-stamp-cell.picked { background: #eef4fb; border-color: var(--accent); }
.controls-stamp-cell.here { box-shadow: inset 2px 0 0 var(--accent); }
.controls-stamp-cell-num { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
.controls-stamp-cell-name { font-size: 12px; }
.controls-stamp-cell-was { font-size: 10px; color: var(--fg-light); }
.controls-stamp-foot { display: flex; justify-content: flex-end; margin-top: 12px; }

/* Prose stays at a readable measure; the switch preview inside it must not,
   since its width is the pedalboard's, not the paragraph's. */
.controls-bank-empty-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.controls-bank-empty p { font-size: 13px; margin: 0 0 8px; max-width: 62ch; }
.controls-observed-names { color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.controls-warn { color: #be123c; font-weight: 600; }

.controls-holds {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; margin-bottom: 12px;
  background: var(--bg-section); border-radius: var(--radius);
}
.controls-holds label {
  font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--fg-muted); font-weight: 600;
}
.controls-holds-select { font-size: 12px; min-width: 300px; }
.controls-holds-budget {
  font-size: 12px; font-variant-numeric: tabular-nums;
  font-weight: 600; color: var(--fg-muted);
}
.controls-holds-budget.over { color: #be123c; }
.controls-holds-where { margin-left: auto; font-size: 11px; color: var(--fg-light); }

.controls-board-held { max-width: 68ch; }
.controls-board-held p { font-size: 13px; margin: 0 0 8px; }

.controls-bank-switch-board {
  font-size: 10px; color: #7e22ce; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.controls-switch-body { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.controls-switch-body > *:first-child { flex: 1 1 380px; min-width: 0; }
.controls-switch-body > .controls-search-panel { flex: 1 1 280px; min-width: 0; }

/* ──── Two columns: instrument left, work right ──── */

.controls-columns {
  display: grid;
  grid-template-columns: minmax(280px, 30%) 1fr;
  align-items: start;
  min-height: calc(100vh - 90px);
}
.controls-col-instrument {
  border-right: 1px solid var(--border);
  position: sticky;
  top: 0;
  max-height: calc(100vh - 90px);
  overflow-y: auto;
}
.controls-col-work { min-width: 0; }
.controls-col-work > .controls-zone:first-child { border-top: none; }

@media (max-width: 1100px) {
  .controls-columns { grid-template-columns: 1fr; }
  .controls-col-instrument {
    border-right: none; border-bottom: 1px solid var(--border);
    position: static; max-height: none;
  }
}

/* In a column of its own the grid wants to be narrower and denser. Compact
   still drops the legend, graph and warnings once a bank is chosen, so the
   left column is a chooser rather than a second thing to read. */
.controls-col-instrument .survey-grid {
  grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
}
.survey.compact .survey-card { padding: 4px 5px 5px; }
.survey.compact .survey-card-name {
  font-size: 10px; margin: 0 0 4px;
}
.survey.compact .survey-card-jumps { display: none; }
.survey.compact .survey-slot { height: 7px; }

/* ──── The instrument survey ──── */

.survey { padding: 12px; display: flex; flex-direction: column; gap: 14px; }

.survey-header h3 {
  font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--fg-muted); margin: 0 0 4px;
}
.survey-summary { margin: 0 0 8px; font-size: 13px; color: var(--fg); }
.survey-status { margin: 6px 0 0; font-size: 12px; color: var(--fg-muted); }
.survey-actions { display: flex; align-items: center; gap: 14px; }
.survey-toggle {
  font-size: 12px; color: var(--fg-muted);
  display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
}

.survey-legend { display: flex; flex-direction: column; gap: 4px; }
.survey-legend-row { display: flex; flex-wrap: wrap; gap: 14px; }
.survey-legend-item {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--fg-muted);
}
.survey-legend-note { margin: 0; font-size: 11px; color: var(--fg-light); font-style: italic; }
.survey-swatch {
  width: 12px; height: 12px; border-radius: 2px;
  border: 1px solid rgba(0, 0, 0, 0.12); display: inline-block;
}
.survey-prov-mark { font-size: 12px; color: var(--fg); width: 12px; text-align: center; }

/* Six across matches the navigation map, so a bank sits in the same place in
   both and the eye can move between them without re-reading numbers. */
.survey-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
  gap: 8px;
}

.survey-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 8px 8px;
  background: #fff;
  cursor: pointer;
  transition: border-color .1s, box-shadow .1s;
}
.survey-card:hover { border-color: var(--fg-light); }
.survey-card.open { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.survey-card.home { border-left: 3px solid var(--active-bg); }
/* Hatched rather than blank: the card is refusing to make a claim, and it
   should not look like an answer. */
.survey-card.unknown {
  background: repeating-linear-gradient(
    45deg, #fafafa, #fafafa 5px, #f1f1f3 5px, #f1f1f3 10px);
  border-style: dashed;
}

.survey-card-head { display: flex; align-items: baseline; gap: 2px; }
.survey-card-num { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.survey-card-prov { margin-left: auto; font-size: 11px; color: var(--fg-muted); }
.survey-card-name {
  font-size: 11px; color: var(--fg-muted); margin: 1px 0 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.survey-card-slots {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
}
.survey-slot {
  display: block; height: 11px; border-radius: 1px;
  border: 1px solid rgba(0, 0, 0, 0.08);
}
.survey-slot.inline {
  display: inline-block; width: 10px; height: 10px; margin-right: 5px;
  vertical-align: -1px;
}

.survey-missing {
  font-size: 12px; margin: 4px 0 0; padding: 6px 8px;
  background: #fff7ed; border-left: 3px solid #d97706; border-radius: var(--radius);
  font-variant-numeric: tabular-nums;
}

.survey-card-unread { font-size: 11px; color: var(--fg-light); font-style: italic; padding: 4px 0; }

/* Read from the device but never authored here: we know the names and not the
   messages, so these are outlines rather than filled verb swatches. Claiming a
   verb colour would claim knowledge a read cannot supply. */
.survey-card-observed {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 4px;
}
.survey-slot-named {
  font-size: 9px; line-height: 1.3; text-align: center;
  padding: 1px 0; border: 1px solid var(--border); border-radius: 2px;
  color: var(--fg-muted); overflow: hidden; white-space: nowrap;
}
.survey-slot-named.vacant { border-style: dashed; opacity: .45; }
/* Compact drops the names — there is no room for them in a 7px strip. What it
   must not drop is *occupancy*: an outline with its text hidden reads as an
   empty switch, so the whole instrument looked unread the moment you clicked
   into a bank. Filled means named, hollow means empty, which is the same thing
   the verb bars say one row up. The grey is deliberately lighter than Raw's
   #9ca3af so a name-only slot never passes for a classified one. */
.survey.compact .survey-slot-named {
  font-size: 0; line-height: 7px; padding: 0;
  background: #cbd5e1; border-color: #cbd5e1;
}
.survey.compact .survey-slot-named.vacant { background: transparent; opacity: .5; }
.survey-card-jumps { font-size: 10px; color: var(--fg-muted); margin-top: 5px; font-variant-numeric: tabular-nums; }
.survey-card-disagree { font-size: 10px; color: #be123c; margin-top: 3px; font-weight: 600; }

.survey-navmap h4, .survey-expanded-head h4 {
  font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--fg-muted); margin: 0 0 6px;
}
.survey-navmap-svg { width: 100%; max-width: 560px; height: auto; display: block; }
.survey-navmap-label { font-size: 8px; font-weight: 600; }
.survey-navmap-empty { font-size: 12px; color: var(--fg-light); font-style: italic; }

.survey-warnings { border-left: 3px solid #d97706; padding: 2px 0 2px 10px; }
.survey-warn-reach { margin: 0 0 4px; font-size: 12px; color: var(--fg-muted); }
.survey-warn { margin: 0 0 4px; font-size: 12px; color: var(--fg); }
.survey-warn.soft { color: var(--fg-muted); }

.survey-expanded {
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  padding: 10px 12px;
  background: #fff;
}
.survey-expanded-head { display: flex; align-items: center; gap: 12px; }
.survey-expanded-head h4 { margin: 0; }
.survey-expanded-prov { font-size: 11px; color: var(--fg-muted); margin-right: auto; }
.survey-expanded-unread { font-size: 12px; color: var(--fg-muted); margin: 8px 0 0; max-width: 60ch; }
.survey-expanded-table { border-collapse: collapse; font-size: 12px; width: 100%; margin-top: 8px; }
.survey-expanded-table th {
  text-align: left; font-weight: 600; color: var(--fg-muted);
  font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  padding: 3px 10px 3px 0; border-bottom: 1px solid var(--border);
}
.survey-expanded-table td {
  padding: 4px 10px 4px 0; border-bottom: 1px solid var(--border-light);
}
.survey-expanded-table td:first-child { font-variant-numeric: tabular-nums; color: var(--fg-muted); width: 3em; }
.survey-expanded-table td:last-child { color: var(--fg-muted); }

.controls-top-row {
  display: flex;
  gap: 16px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}

.controls-bank-col {
  flex: 0 0 auto;
  min-width: 260px;
  max-width: 340px;
}

.controls-props-col {
  flex: 0 0 auto;
  min-width: 240px;
  max-width: 400px;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: 0 16px;
}

.controls-search-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 200px;
}

.controls-bottom-row {
  padding: 8px 12px;
  flex: 1;
}

.controls-heading { font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--fg-muted); }

.controls-bank-list { }

.controls-bank-list-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.controls-bank-items { display: flex; flex-direction: column; gap: 2px; }

.controls-bank-item {
  border-radius: var(--radius);
  transition: background 0.1s;
}

.controls-bank-item-header {
  padding: 6px 8px;
  cursor: pointer;
  border-radius: var(--radius);
}
.controls-bank-item-header:hover { background: var(--bg-section); }
.controls-bank-item.selected .controls-bank-item-header { background: var(--active-bg); color: var(--active-fg); }

.controls-bank-item-name { font-size: 13px; font-weight: 500; }
.controls-bank-item-num { font-size: 11px; color: var(--fg-light); }
.controls-bank-item.selected .controls-bank-item-num { color: rgba(255,255,255,0.6); }

.controls-bank-name-input {
  font-size: 13px;
  font-weight: 500;
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255,255,255,0.3);
  color: inherit;
  padding: 0 2px;
  width: 100%;
}
.controls-bank-name-input:focus { outline: none; border-bottom-color: rgba(255,255,255,0.6); }

.controls-bank-num-input {
  font-size: 11px;
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255,255,255,0.3);
  color: inherit;
  padding: 0 2px;
  width: 36px;
  -moz-appearance: textfield;
}
.controls-bank-num-input::-webkit-inner-spin-button,
.controls-bank-num-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.controls-bank-num-input:focus { outline: none; border-bottom-color: rgba(255,255,255,0.6); }

.controls-bank-expanded { padding: 10px 4px 12px; }

.controls-bank-actions { display: flex; gap: 4px; margin-top: 8px; }

.controls-new-bank-form { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; padding: 8px; background: var(--bg-section); border-radius: var(--radius); }
.controls-new-bank-form input { font-size: 13px; padding: 4px 6px; border: 1px solid var(--border); border-radius: var(--radius); }
.controls-form-buttons { display: flex; gap: 4px; }

/* Switch grid */

.controls-switch-panel { }

.controls-switch-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  margin-bottom: 12px;
}

.controls-switch {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.1s;
  min-height: 52px;
}
.controls-switch:hover { border-color: var(--fg-muted); }
.controls-switch.selected { background: var(--active-bg); color: var(--active-fg); border-color: var(--active-bg); }
.controls-switch.return { border-style: dashed; }
.controls-switch.return.selected { border-style: solid; }

.controls-switch-letter { font-size: 11px; font-weight: 600; opacity: 0.5; }
.controls-switch.selected .controls-switch-letter { opacity: 0.7; }
.controls-switch-label { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 72px; text-align: center; }

.controls-switch-summary { text-align: center; }
.controls-switch-summary-label { font-size: 12px; font-weight: 600; }
.controls-switch-summary-long { font-size: 11px; color: var(--fg-muted); }

/* Message editor */

.controls-message-editor {
  min-width: 0;
  overflow-y: auto;
}

.controls-bank-props { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }

.controls-field-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.controls-field-row label {
  font-size: 12px;
  font-weight: 500;
  color: var(--fg-muted);
  min-width: 60px;
}
.controls-field-row input[type="text"],

.controls-switch-edit { margin-top: 4px; }

.controls-messages-header { font-size: 12px; font-weight: 600; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.03em; margin: 12px 0 6px; }

.controls-messages { display: flex; flex-direction: column; gap: 3px; }

.controls-message-row {

.controls-msg-fields { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }

/* Buttons */

.controls-btn {

}
.controls-btn:hover { border-color: var(--fg-muted); }
.controls-btn.controls-btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.controls-btn.controls-btn-accent:hover { opacity: 0.9; }

.controls-btn-small {
  font-size: 11px;
  padding: 2px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius);

.controls-btn-danger { color: #c00; }

.controls-btn-tiny {

/* CC Search */

.controls-search-input-row {

  color: var(--fg-muted);
  flex-shrink: 0;

  font-size: 12px;
  padding: 3px 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.controls-search-results {

.controls-search-kind {

  color: var(--fg-light);
  min-width: 48px;
}

.controls-cc-num { font-family: var(--mono); font-size: 11px; color: var(--fg-muted); min-width: 40px; }
.controls-cc-label { flex: 1; }

/* CC Dictionary (modal overlay) */

.controls-dict-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
}

.controls-dict-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
}

.controls-dict-modal {
  position: relative;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
  max-width: 800px;
  width: 90%;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.controls-dict-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}

.controls-dict-close {
  font-size: 20px;
  line-height: 1;
  background: none;
  border: none;
  color: var(--fg-muted);
  cursor: pointer;
  padding: 0 4px;
}
.controls-dict-close:hover { color: var(--fg); }

.controls-dict-header {
  font-size: 12px;
  font-weight: 600;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.controls-dict-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 14px;
  overflow-y: auto;
  flex: 1;
}

.controls-dict-pedal {
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
}

.controls-dict-pedal-header {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 8px;
  cursor: pointer;
  font-size: 13px;
}
.controls-dict-pedal-header:hover { background: var(--bg-section); }

.controls-dict-arrow { font-size: 12px; min-width: 14px; color: var(--fg-muted); }
.controls-dict-pedal-name { font-weight: 600; }
.controls-dict-pedal-meta { font-size: 11px; color: var(--fg-muted); margin-left: 4px; }

.controls-dict-sections { padding: 4px 8px 8px 22px; display: flex; flex-direction: column; gap: 4px; }

.controls-dict-section {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  font-size: 12px;
}

.controls-dict-section-name {
  font-weight: 600;
  font-size: 11px;
  color: var(--fg-muted);
  margin-right: 2px;
}

.controls-dict-controls { display: flex; flex-wrap: wrap; gap: 3px; }

.controls-dict-control {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 1px 4px;
  background: var(--bg-section);
  border-radius: 3px;
  font-size: 11px;

.controls-dict-control-label { white-space: nowrap; }

/* Switch sections (all-switches panel) */

.controls-sw-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.controls-sw-section {
  padding: 6px 8px 6px 10px;
  border-radius: var(--radius);
  background: var(--bg);
}

.controls-sw-section-header {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}

.controls-sw-section-letter {
  font-size: 14px;
  font-weight: 700;
  min-width: 16px;
}

.controls-sw-label-input {
  font-size: 12px;
  padding: 2px 4px;
  border: 1px solid var(--border-light);
  border-radius: 2px;
  width: 64px;

}

.controls-sw-long-input {
  font-size: 12px;
  padding: 2px 4px;

  font-weight: 600;
  text-transform: uppercase;

/* --- Pedal Donut View --- */

.pedal-view-container { display: flex; justify-content: center; padding: 16px; }
.pedal-view { max-width: 600px; width: 100%; }
.pedal-view-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
.pedal-view-header h2 { font-size: 18px; font-weight: 700; }
.pedal-view-header .brand { font-size: 13px; color: var(--fg-muted); }
.pedal-view-header .channel { font-size: 13px; color: var(--fg-light); font-family: var(--mono); }
.pedal-svg { width: 100%; display: block; }
.pedal-svg text { font-family: var(--font); }
.pedal-view-back {
  margin-top: 12px;
  padding: 4px 12px;
  font-size: 13px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--fg-muted);
  cursor: pointer;
}
.pedal-view-back:hover { color: var(--fg); border-color: var(--fg-muted); }

.card-donut-btn {
  margin-left: auto;
  padding: 0 4px;
  font-size: 14px;
  line-height: 1;
  border: none;
  background: none;
  color: var(--fg-light);
  cursor: pointer;
  opacity: 0.5;
}
.card-donut-btn:hover { opacity: 1; color: var(--pedal-color, var(--fg)); }

/* --- Overview View (treemap) --- */

.overview-container {
  display: flex;
  gap: 8px;
  padding: 16px;
  height: calc(100vh - 75px);
  box-sizing: border-box;
}
.overview-detail {
  flex-shrink: 0;
  height: 100%;
  border: 2px solid var(--border-light);
  border-radius: var(--radius);
  padding: 6px;
  box-sizing: border-box;
}
.overview-detail svg { width: 100%; height: 100%; }

/* Knob drags are pointer-driven, so the browser must not claim the gesture for
   scrolling or pinch-zoom. Without this, touch drags on iOS fire pointercancel
   the moment the finger moves and the knob stops tracking. Desktop is
   unaffected. Thumbnails are excluded — they are not draggable, so leaving them
   scrollable keeps the treemap usable on touch. */
#pedal-donut-hats,
#pedal-donut-hats svg,
.overview-detail,
.overview-detail svg {
  touch-action: none;
}

.overview-treemap {
  flex: 1;
  min-width: 0;
  /* grid-template set via inline style from PureScript */
}

.overview-cell {
  min-width: 0;
  min-height: 0;
  border: 2px solid var(--border-light);
  border-radius: var(--radius);
  padding: 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: border-color 0.2s ease;
}
.overview-cell:hover { border-color: var(--border); }
.overview-cell.active {
  border: 3px solid var(--fg);
  box-shadow: 0 0 0 2px var(--bg), 0 0 12px rgba(0,0,0,0.15);
  z-index: 1;
  transform: scale(1.02);
}

.overview-cell svg { width: 100%; height: 100%; }

.overview-cell-inner {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.overview-cell-inner > div:first-child { flex: 1; min-height: 0; }

.overview-cell-label {
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  text-align: center;
  margin-top: 2px;
  padding: 1px 5px;
  border-radius: 3px;
  flex-shrink: 0;
  line-height: 1;
}

.overview-cell-placeholder {
  text-align: center;
  color: var(--fg-light);
}
.overview-cell-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--fg-muted);
}
.overview-cell-brand {
  font-size: 10px;
}

/* Folder backup card (Chrome File System Access API → Infovore) */
.folder-backup {
  margin: 16px 0;
  padding: 12px 16px;
  background: var(--bg-section);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.folder-backup h3 {
  margin: 0 0 8px 0;
  font-size: 14px;
  font-weight: 600;
}
.folder-backup-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.folder-backup-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 12px;
  font-family: var(--mono);
}
.folder-backup-chip.connected {
  background: var(--active-bg);
  color: var(--active-fg);
}
.folder-backup-chip.disconnected {
  background: var(--border);
  color: var(--fg-muted);
}
.folder-backup-muted {
  font-size: 12px;
  color: var(--fg-muted);
}
.folder-backup-error {
  margin-top: 8px;
  padding: 6px 10px;
  background: #fee;
  color: #b00;
  font-size: 12px;
  border-radius: 3px;
}
.files-btn-muted {
  background: #fff !important;
  color: var(--fg) !important;
}
/* For the one action that overwrites banks it is not asked about. Distinct
   from the muted style rather than a shade of it: this button should not be
   findable by reaching for where the last one was. */
.files-btn-danger {
  background: #b00 !important;
  color: #fff !important;
  border-color: #900 !important;
}
