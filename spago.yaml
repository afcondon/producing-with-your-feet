package:
  name: producing-with-your-feet
  dependencies:
    - aff: ">=8.0.0 <9.0.0"
    - argonaut-core: ">=7.0.0 <8.0.0"
    - arrays: ">=7.3.0 <8.0.0"
    - codec-argonaut: ">=10.0.0 <11.0.0"
    - colors: ">=7.0.1 <8.0.0"
    - console: ">=6.1.0 <7.0.0"
    - datetime: ">=6.1.0 <7.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - either: ">=6.1.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - foreign-object: ">=4.1.0 <5.0.0"
    - halogen: ">=7.0.0 <8.0.0"
    - halogen-subscriptions: ">=2.0.0 <3.0.0"
    - glassbox
    - helm
    - hylograph-graph
    - hylograph-selection
    - hylograph-transitions
    - integers: ">=6.0.0 <7.0.0"
    - itajara-client
    - itajara-controllers
    - itajara-surface
    - js-date: ">=8.0.0 <9.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - numbers: ">=9.0.1 <10.0.0"
    - ordered-collections: ">=3.2.0 <4.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - strings: ">=6.0.1 <7.0.0"
    - transformers: ">=6.1.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - web-events: ">=4.0.0 <5.0.0"
    - web-html: ">=4.1.1 <5.0.0"
    - web-storage: ">=5.0.0 <6.0.0"
    - web-uievents: ">=5.0.0 <6.0.0"
  build:
    strict: true
  test:
    main: Test.Main
    dependencies: []
  # **The outfile lives here so it cannot be forgotten on the command line.**
  # `spago bundle` without `-p` builds, prints a success line, and only then
  # refuses — the workspace has two packages — leaving `static/index.js`
  # untouched while every symptom reads as "the change had no effect".
  # With this stanza the whole command is `spago bundle -p producing-with-your-feet`.
  bundle:
    module: Main
    outfile: static/index.js
    platform: browser
  publish:
    license: MIT
    version: 0.1.0

workspace:
  packageSet:
    registry: 77.13.1
  extraPackages:
    hylograph-selection: 0.5.3
    hylograph-graph: 0.3.0
    hylograph-transitions: 0.1.0
    httpurple: 4.0.0
    # The Itajara client lives with the daemon now (music/itajara); this app
    # is its first consumer and reaches it by path.
    itajara-client:
      path: ../itajara/client
    itajara-surface:
      path: ../itajara/surface
    # The looper's own MC6 pages (and next its Twister pages and process):
    # Data.Looper.Banks moved there 2026-11-05 so Quadrat can read them too.
    itajara-controllers:
      path: ../itajara/controllers
    # The controllers — device profiles and the one Web MIDI FFI — shared
    # with Triggerfish (music/helm).
    helm:
      path: ../helm
    # State machines as data artifacts (static/machines/*.json), run by
    # Glassbox.Run.step; the Twister's owner is the first.
    glassbox:
      path: ../../purescript-hylograph-libs/purescript-glassbox/core
