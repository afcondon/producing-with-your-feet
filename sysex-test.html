<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MC6 SysEx Protocol Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; padding: 24px; max-width: 900px; background: #fafafa; color: #222; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  h2 { font-size: 14px; font-weight: 600; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 0.5px; color: #666; }
  .status { padding: 8px 12px; border-radius: 4px; margin-bottom: 16px; font-size: 13px; }
  .status.ok { background: #e8f5e9; color: #2e7d32; }
  .status.err { background: #fbe9e7; color: #c62828; }
  .status.pending { background: #fff3e0; color: #e65100; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  button { padding: 8px 16px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; }
  button:hover { background: #f0f0f0; }
  button:active { background: #e0e0e0; }
  button.primary { background: #1976d2; color: #fff; border-color: #1565c0; }
  button.primary:hover { background: #1565c0; }
  button.danger { background: #c62828; color: #fff; border-color: #b71c1c; }
  button.danger:hover { background: #b71c1c; }
  button:disabled { opacity: 0.4; cursor: default; }
  label { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  select, input { font-size: 13px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; }
  input[type=number] { width: 60px; }
  #log { font-family: 'SF Mono', 'Menlo', monospace; font-size: 12px; line-height: 1.6; background: #1e1e1e; color: #d4d4d4;
         padding: 12px; border-radius: 4px; height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  .log-send { color: #4fc3f7; }
  .log-recv { color: #aed581; }
  .log-info { color: #fff176; }
  .log-err { color: #ef9a9a; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
</style>
</head>
<body>

<h1>MC6 MKII SysEx Protocol Test</h1>
<div id="status" class="status pending">Requesting MIDI access...</div>

<h2>MIDI Ports</h2>
<div class="row">
  <label>Output: <select id="outPort"></select></label>
  <label>Input: <select id="inPort"></select></label>
  <button onclick="connectPorts()">Connect</button>
</div>

<h2>1. Editor Session</h2>
<div class="controls">
  <button onclick="sendConnect()">Enter Editor</button>
  <button onclick="sendDisconnect()">Exit Editor</button>
</div>

<h2>2. Upload Handshake (F1=7)</h2>
<div class="controls">
  <button class="primary" onclick="sendStartUpload()">Start Upload (7,0,48,0)</button>
  <button onclick="sendCompleteUpload()">Complete Upload (7,0,49,0)</button>
</div>

<h2>3. Send Preset (F1=7, F2=17)</h2>
<div class="row">
  <label>Bank: <input type="number" id="bankNum" value="0" min="0" max="29"></label>
  <label>Preset: <input type="number" id="presetNum" value="0" min="0" max="11"></label>
  <label>Name: <input type="text" id="presetName" value="TestPC" maxlength="8"></label>
</div>
<div class="controls">
  <button class="primary" onclick="sendTestPreset()">Send PC50/Ch3 Preset</button>
  <button onclick="sendEmptyPreset()">Send Empty (Clear)</button>
</div>

<h2>4. Full Sequence</h2>
<div class="controls">
  <button class="primary" onclick="runFullSequence()">Enter → Upload → Preset → Complete → Exit</button>
  <button class="danger" onclick="runClearSequence()">Enter → Upload → Clear → Complete → Exit</button>
</div>

<h2>5. Legacy Protocol (F1=6, our old approach)</h2>
<div class="controls">
  <button onclick="sendLegacyPreset()">Send via F1=6 (for comparison)</button>
  <button onclick="sendStartTx()">Start Tx (4,0)</button>
  <button onclick="sendEndTx()">End Tx (4,1)</button>
</div>

<div style="display:flex; justify-content:space-between; align-items:center; margin-top: 16px;">
  <h2 style="margin:0">Log</h2>
  <button onclick="clearLog()">Clear</button>
</div>
<div id="log"></div>

<script>
const MANF = [0x00, 0x21, 0x24]; // Morningstar manufacturer ID
const MC6MK2 = 0x03; // device model ID

let midiAccess = null;
let outPort = null;
let inPort = null;

// --- Logging ---
const logEl = document.getElementById('log');
function log(msg, cls = '') {
  const span = document.createElement('span');
  span.className = cls;
  span.textContent = msg + '\n';
  logEl.appendChild(span);
  logEl.scrollTop = logEl.scrollHeight;
}
function logSend(label, bytes) {
  log(`SEND [${label}]: ${hex(bytes)}`, 'log-send');
}
function logRecv(bytes) {
  log(`RECV: ${hex(bytes)}`, 'log-recv');
  parseSysEx(bytes);
}
function logInfo(msg) { log(msg, 'log-info'); }
function logErr(msg) { log(msg, 'log-err'); }
function clearLog() { logEl.innerHTML = ''; }

function hex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ');
}

// --- Parse incoming SysEx for human-readable info ---
function parseSysEx(bytes) {
  if (bytes[0] !== 0xF0) return;
  if (bytes[1] === 0x00 && bytes[2] === 0x21 && bytes[3] === 0x24) {
    const devId = bytes[4];
    const f1 = bytes[6], f2 = bytes[7], f3 = bytes[8], f4 = bytes[9];
    let desc = `  Device=${devId} F1=${f1} F2=${f2} F3=${f3} F4=${f4}`;

    // Known responses
    if (f1 === 7 && f2 === 0 && f3 === 0) desc += ' → Upload ACK (start)';
    if (f1 === 7 && f2 === 0 && f3 === 3) desc += ' → Upload ERROR';
    if (f1 === 7 && f2 === 0 && f3 === 17) desc += ' → Upload COMPLETE (success)';
    if (f1 === 7 && f2 === 0 && f3 === 33) desc += ' → READY FOR NEXT DATA';
    if (f1 === 0 && f2 === 0) desc += ' → Device identify response';
    if (f1 === 2) desc += ' → Data dump packet';
    if (f1 === 0 && f2 === 1) desc += ' → Preset data response';

    logInfo(desc);
  }
}

// --- SysEx frame builder ---
function checksum(bytes) {
  let cs = 0;
  for (const b of bytes) cs ^= b;
  return cs & 0x7F;
}

function sysexFrame(deviceId, f1, f2, f3 = 0, f4 = 0, f5 = 0, f6 = 0, payload = []) {
  const frame = [
    0xF0, ...MANF, deviceId, 0x00,
    f1 & 0x7F, f2 & 0x7F, f3 & 0x7F, f4 & 0x7F, f5 & 0x7F, f6 & 0x7F,
    0x00, 0x00, 0x00, 0x00,
    ...payload
  ];
  const cs = checksum(frame);
  frame.push(cs, 0xF7);
  return frame;
}

// --- TLV builders (MC6 MKII: 8-char short, 8-char toggle, 24-char long, 16 msgs x 9 bytes) ---
function padName(str, len) {
  const out = [];
  for (let i = 0; i < len; i++) {
    out.push(i < str.length ? str.charCodeAt(i) : 0x20); // space-padded
  }
  return out;
}

function headerTLV(bankNum, presetNum) {
  return [0x7F, 0x00, 0x03, bankNum, presetNum, 0x00]; // isExp=0
}

function messageTLV(msgIndex, type, data1, data2, data3, channel, action, toggle, data4) {
  return [0x7F, 0x01, 0x09, msgIndex, type, data1, data2, data3, channel, action, toggle, data4];
}

function emptyMessageTLV(msgIndex) {
  return messageTLV(msgIndex, 0, 0, 0, 0, 1, 0, 0, 0); // type=empty, ch=1, action=none, toggle=off
}

function shortNameTLV(name) { return [0x7F, 0x02, 0x08, ...padName(name, 8)]; }
function toggleNameTLV(name) { return [0x7F, 0x03, 0x08, ...padName(name, 8)]; }
function longNameTLV(name) { return [0x7F, 0x04, 0x18, ...padName(name, 24)]; }
function configTLV() { return [0x7F, 0x05, 0x04, 0x00, 0x00, 0x00, 0x00]; }

function buildPresetTLV(bankNum, presetNum, shortName, longName, messages) {
  const tlv = [];
  // Header
  tlv.push(...headerTLV(bankNum, presetNum));
  // 16 message slots
  for (let i = 0; i < 16; i++) {
    if (i < messages.length) {
      const m = messages[i];
      tlv.push(...messageTLV(i, m.type, m.data1, m.data2, m.data3, m.channel, m.action, m.toggle, m.data4 || 0));
    } else {
      tlv.push(...emptyMessageTLV(i));
    }
  }
  // Names
  tlv.push(...shortNameTLV(shortName));
  tlv.push(...toggleNameTLV(shortName));
  tlv.push(...longNameTLV(longName));
  // Config
  tlv.push(...configTLV());
  return tlv;
}

// A PC message: type=1 (PC), data1=progNum, channel, action=1 (press)
function pcMessage(channel, progNum) {
  return { type: 1, data1: progNum, data2: 0, data3: 0, channel: channel, action: 1, toggle: 2, data4: 0 };
}

// --- MIDI send ---
function send(bytes) {
  if (!outPort) { logErr('No output port connected'); return; }
  outPort.send(bytes);
}

// --- Protocol commands ---

// Editor session (device 0x00)
function sendConnect() {
  const bytes = sysexFrame(0x00, 0, 0x1B);
  logSend('Enter Editor (0,1B)', bytes);
  send(bytes);
}
function sendDisconnect() {
  const bytes = sysexFrame(0x00, 0, 0x1C);
  logSend('Exit Editor (0,1C)', bytes);
  send(bytes);
}

// Upload handshake (device MC6MK2, F1=7)
function sendStartUpload() {
  const bytes = sysexFrame(MC6MK2, 7, 0, 48, 0);
  logSend('Start Upload (7,0,48,0)', bytes);
  send(bytes);
}
function sendCompleteUpload() {
  const bytes = sysexFrame(MC6MK2, 7, 0, 49, 0);
  logSend('Complete Upload (7,0,49,0)', bytes);
  send(bytes);
}

// Preset data via F1=7, F2=17
function sendTestPreset() {
  const bankNum = +document.getElementById('bankNum').value;
  const presetNum = +document.getElementById('presetNum').value;
  const name = document.getElementById('presetName').value || 'Test';
  const tlv = buildPresetTLV(bankNum, presetNum, name, name, [pcMessage(3, 50)]);
  const bytes = sysexFrame(MC6MK2, 7, 17, presetNum, 0, 0, 0, tlv);
  logSend(`Preset F1=7 F2=17 bank=${bankNum} preset=${presetNum}`, bytes);
  logInfo(`  TLV payload: ${tlv.length} bytes`);
  send(bytes);
}

function sendEmptyPreset() {
  const bankNum = +document.getElementById('bankNum').value;
  const presetNum = +document.getElementById('presetNum').value;
  const tlv = buildPresetTLV(bankNum, presetNum, '', '', []);
  const bytes = sysexFrame(MC6MK2, 7, 17, presetNum, 0, 0, 0, tlv);
  logSend(`Empty Preset F1=7 F2=17 preset=${presetNum}`, bytes);
  send(bytes);
}

// Legacy (our old wrong approach, for comparison)
function sendLegacyPreset() {
  const bankNum = +document.getElementById('bankNum').value;
  const presetNum = +document.getElementById('presetNum').value;
  const name = document.getElementById('presetName').value || 'Test';
  const tlv = buildPresetTLV(bankNum, presetNum, name, name, [pcMessage(3, 50)]);
  const bytes = sysexFrame(MC6MK2, 6, 0x11, bankNum, presetNum, 0, 0, tlv);
  logSend(`LEGACY Preset F1=6 F2=11 bank=${bankNum} preset=${presetNum}`, bytes);
  send(bytes);
}
function sendStartTx() {
  const bytes = sysexFrame(MC6MK2, 4, 0);
  logSend('Start Tx (4,0)', bytes);
  send(bytes);
}
function sendEndTx() {
  const bytes = sysexFrame(MC6MK2, 4, 1);
  logSend('End Tx (4,1)', bytes);
  send(bytes);
}

// --- Full automated sequences ---
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// Queue for waiting on specific MC6 responses
let responseWaiters = [];
function waitForResponse(f1, f2, f3, timeout = 5000) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      responseWaiters = responseWaiters.filter(w => w !== waiter);
      reject(new Error(`Timeout waiting for F1=${f1} F2=${f2} F3=${f3}`));
    }, timeout);
    const waiter = { f1, f2, f3, resolve, timer };
    responseWaiters.push(waiter);
  });
}

function checkWaiters(bytes) {
  if (bytes[0] !== 0xF0 || bytes[1] !== 0x00 || bytes[2] !== 0x21 || bytes[3] !== 0x24) return;
  const f1 = bytes[6], f2 = bytes[7], f3 = bytes[8];
  for (let i = responseWaiters.length - 1; i >= 0; i--) {
    const w = responseWaiters[i];
    if (w.f1 === f1 && w.f2 === f2 && w.f3 === f3) {
      clearTimeout(w.timer);
      responseWaiters.splice(i, 1);
      w.resolve(bytes);
    }
  }
}

async function runFullSequence() {
  const bankNum = +document.getElementById('bankNum').value;
  const presetNum = +document.getElementById('presetNum').value;
  const name = document.getElementById('presetName').value || 'Test';
  logInfo('=== FULL SEQUENCE START ===');
  try {
    // 1. Enter editor
    sendConnect();
    await delay(500);

    // 2. Start upload
    sendStartUpload();
    logInfo('Waiting for READY FOR NEXT (7,0,33)...');
    try {
      await waitForResponse(7, 0, 33, 5000);
      logInfo('Got READY signal');
    } catch (e) {
      logErr('No READY signal received — sending preset anyway');
    }

    // 3. Send preset
    const tlv = buildPresetTLV(bankNum, presetNum, name, name, [pcMessage(3, 50)]);
    const bytes = sysexFrame(MC6MK2, 7, 17, presetNum, 0, 0, 0, tlv);
    logSend(`Preset bank=${bankNum} preset=${presetNum}`, bytes);
    send(bytes);
    await delay(300);

    // 4. Complete upload
    sendCompleteUpload();
    logInfo('Waiting for COMPLETE (7,0,17)...');
    try {
      await waitForResponse(7, 0, 17, 5000);
      logInfo('Upload confirmed complete!');
    } catch (e) {
      logErr('No COMPLETE signal — may have worked anyway');
    }
    await delay(200);

    // 5. Exit editor
    sendDisconnect();
    logInfo('=== FULL SEQUENCE DONE ===');
  } catch (e) {
    logErr('Sequence error: ' + e.message);
    sendDisconnect();
  }
}

async function runClearSequence() {
  const bankNum = +document.getElementById('bankNum').value;
  const presetNum = +document.getElementById('presetNum').value;
  logInfo('=== CLEAR SEQUENCE START ===');
  try {
    sendConnect();
    await delay(500);
    sendStartUpload();
    logInfo('Waiting for READY...');
    try { await waitForResponse(7, 0, 33, 5000); logInfo('Got READY'); } catch(e) { logErr('No READY — continuing'); }
    const tlv = buildPresetTLV(bankNum, presetNum, '', '', []);
    const bytes = sysexFrame(MC6MK2, 7, 17, presetNum, 0, 0, 0, tlv);
    logSend(`Clear preset=${presetNum}`, bytes);
    send(bytes);
    await delay(300);
    sendCompleteUpload();
    try { await waitForResponse(7, 0, 17, 5000); logInfo('Clear confirmed!'); } catch(e) { logErr('No COMPLETE signal'); }
    await delay(200);
    sendDisconnect();
    logInfo('=== CLEAR DONE ===');
  } catch (e) {
    logErr('Error: ' + e.message);
    sendDisconnect();
  }
}

// --- MIDI setup ---
function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + cls;
}

function populatePorts() {
  const outSel = document.getElementById('outPort');
  const inSel = document.getElementById('inPort');
  outSel.innerHTML = '<option value="">-- select --</option>';
  inSel.innerHTML = '<option value="">-- select --</option>';
  for (const [id, port] of midiAccess.outputs) {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = port.name;
    if (port.name && port.name.includes('MC6')) opt.selected = true;
    outSel.appendChild(opt);
  }
  for (const [id, port] of midiAccess.inputs) {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = port.name;
    if (port.name && port.name.includes('MC6')) opt.selected = true;
    inSel.appendChild(opt);
  }
}

function connectPorts() {
  const outId = document.getElementById('outPort').value;
  const inId = document.getElementById('inPort').value;
  if (outId) {
    outPort = midiAccess.outputs.get(outId);
    logInfo('Output: ' + outPort.name);
  }
  if (inId) {
    if (inPort) inPort.onmidimessage = null;
    inPort = midiAccess.inputs.get(inId);
    inPort.onmidimessage = (e) => {
      const bytes = Array.from(e.data);
      // Only log SysEx (0xF0), skip clock/active sensing
      if (bytes[0] === 0xF0) {
        logRecv(bytes);
        checkWaiters(bytes);
      }
    };
    logInfo('Input: ' + inPort.name);
  }
  if (outPort && inPort) setStatus('Connected to ' + outPort.name, 'ok');
}

navigator.requestMIDIAccess({ sysex: true }).then(access => {
  midiAccess = access;
  setStatus('MIDI access granted', 'ok');
  populatePorts();
  // Auto-connect if MC6 ports found
  connectPorts();
}).catch(err => {
  setStatus('MIDI access denied: ' + err, 'err');
  logErr('MIDI access failed: ' + err);
});
</script>
</body>
</html>
